<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c2c" />
      <stop offset="50%" stop-color="#004d4d" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Ambient Glows -->
  <circle cx="1100" cy="100" r="300" fill="#2dd4bf" fill-opacity="0.08" />
  <circle cx="100" cy="550" r="250" fill="#008080" fill-opacity="0.2" />

  <!-- Card Body -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" filter="url(#glow)" />

  <!-- Top Badge -->
  <g transform="translate(110, 120)">
    <rect x="0" y="0" width="160" height="38" rx="19" fill="#2dd4bf" fill-opacity="0.2" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="80" y="24" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="1">MEDICAL SAAS</text>
  </g>

  <!-- Reversed Pill Icon Emblem on White Badge -->
  <g transform="translate(110, 180)" filter="url(#glow)">
    <rect width="96" height="96" rx="24" fill="#ffffff" />
    <g transform="translate(48, 48) scale(0.16) translate(-256, -256)">
      <g transform="translate(256, 256) rotate(42) translate(-256, -256)">
        <path d="M 160 275 A 96 96 0 0 0 352 275 L 352 260 L 160 260 Z" fill="#008080" />
        <path d="M 174 230 L 174 150 A 78 78 0 0 1 338 150 L 338 230" fill="none" stroke="#008080" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <!-- Title: sehetak - صحتك -->
  <g transform="translate(230, 245)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" letter-spacing="-1">sehetak <tspan fill="url(#tealGrad)">- صحتك</tspan></text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(110, 320)">
    <text x="0" y="0" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28">المنصة الذكية لإدارة الأدوية والتذكيرات الطبية والالتزام العلاجي</text>
    <text x="0" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20">Smart Meal-Anchored Medication Companion &amp; Instant Telegram Bot Reminders</text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(110, 440)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="48" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="130" y="30" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">🤖 تنبيهات تليجرام المباشرة</text>
    </g>
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="270" height="48" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="135" y="30" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">🍽️ ربط الجرعات بمواعيد الوجبات</text>
    </g>
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="250" height="48" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="125" y="30" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">🔔 إشعارات المتصفح الفورية</text>
    </g>
  </g>
</svg>
